<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="product.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>
    <main class="product-card">
        <div class="product-image">
            <img src="image-product-desktop.jpg" alt="Gabrielle Chanel perfume bottle surrounded by green leaves">
        </div>
        <div class="product-card__product-content">
            <p class="product-category">PERFUME</p>
            <h1 class="product-title">Gabrielle Essence Eau<br>De Parfum</h1>
            <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
            <div class="product-pricing">
                <span class="current-price">$149.99</span>
                <del class="original-price">$169.99</del>
            </div>
            <button class="product-card__button" type="button">
                <img src="image.png" alt="">
                <span>Add to Cart</span>
            </button>
        </div>
    </main>
</body>
</html>
